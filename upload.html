<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>上传助手 - 微信上传</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            padding: 16px;
            color: #333;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 20px 0 16px;
        }
        .header h1 {
            font-size: 22px;
            color: #d32f2f;
        }
        .header p {
            font-size: 14px;
            color: #888;
            margin-top: 4px;
        }

        /* 卡片 */
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            color: #333;
        }

        /* 表单 */
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
            background: #fff;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #d32f2f;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* GitHub Token 输入 */
        .token-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .token-row input {
            flex: 1;
        }
        .token-row .btn-save {
            padding: 10px 16px;
            background: #24292e;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .token-row .btn-save:active {
            background: #111;
        }
        .token-status {
            font-size: 13px;
            margin-top: 6px;
        }
        .token-status.ok {
            color: #2e7d32;
        }
        .token-status.err {
            color: #d32f2f;
        }

        /* 图片上传区域 */
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafafa;
            position: relative;
        }
        .upload-area:active {
            background: #f0f0f0;
        }
        .upload-area .icon {
            font-size: 40px;
            margin-bottom: 8px;
        }
        .upload-area .text {
            font-size: 15px;
            color: #888;
        }
        .upload-area .hint {
            font-size: 12px;
            color: #bbb;
            margin-top: 4px;
        }
        .upload-area.has-image {
            border-color: #4caf50;
            background: #f1f8e9;
            padding: 12px;
        }
        .upload-area.has-image .icon {
            font-size: 24px;
        }
        .upload-area input[type="file"] {
            display: none;
        }

        /* 图片预览 */
        .preview-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }
        .preview-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
            background: #f0f0f0;
        }
        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .preview-item .remove {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 14px;
            line-height: 22px;
            text-align: center;
            cursor: pointer;
        }

        /* 平台选择 */
        .platform-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }
        .platform-tab {
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            border: 2px solid #eee;
            background: #fff;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .platform-tab.active {
            border-color: #d32f2f;
            background: #fff5f5;
            color: #d32f2f;
        }
        .platform-tab .emoji {
            display: block;
            font-size: 24px;
            margin-bottom: 4px;
        }

        /* 提示信息 */
        .tip-box {
            background: #e3f2fd;
            border-radius: 8px;
            padding: 14px 16px;
            margin-top: 12px;
            font-size: 14px;
            line-height: 1.7;
            color: #1565c0;
        }
        .tip-box.warn {
            background: #fff3e0;
            color: #e65100;
        }
        .tip-box.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        /* 上传步骤 */
        .step-list {
            list-style: none;
            padding: 0;
        }
        .step-list li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            line-height: 1.6;
        }
        .step-list li:last-child {
            border-bottom: none;
        }
        .step-list .num {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            background: #d32f2f;
            color: #fff;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            font-size: 13px;
            font-weight: 600;
        }
        .step-list .num.green {
            background: #4caf50;
        }

        /* 进度条 */
        .progress-bar {
            display: none;
            margin-bottom: 16px;
        }
        .progress-bar.show {
            display: block;
        }
        .progress-track {
            width: 100%;
            height: 6px;
            background: #eee;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #4caf50;
            border-radius: 3px;
            transition: width 0.3s;
        }
        .progress-text {
            font-size: 14px;
            color: #666;
            text-align: center;
        }
        .progress-text.error {
            color: #d32f2f;
        }
        .progress-text.success {
            color: #2e7d32;
        }

        /* 提交按钮 */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #d32f2f;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:active {
            background: #b71c1c;
        }
        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* 结果弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: #fff;
            border-radius: 16px;
            padding: 28px 24px 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .modal .big-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .modal h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        .modal .summary {
            text-align: left;
            background: #f9f9f9;
            border-radius: 8px;
            padding: 14px;
            margin: 14px 0;
            font-size: 14px;
            line-height: 1.8;
        }
        .modal .summary .row {
            display: flex;
            justify-content: space-between;
        }
        .modal .summary .row .lbl {
            color: #888;
        }
        .modal .summary .row .val {
            font-weight: 500;
        }
        .modal .image-url {
            display: block;
            word-break: break-all;
            font-size: 12px;
            color: #1565c0;
            background: #e3f2fd;
            padding: 8px 10px;
            border-radius: 6px;
            margin-top: 6px;
            text-decoration: none;
        }
        .modal .btn-close {
            padding: 10px 32px;
            background: #d32f2f;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #bbb;
            padding: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <h1>📤 上传助手</h1>
            <p>填写信息 → 选择图片 → 自动上传到仓库</p>
        </div>

        <!-- 选择平台 -->
        <div class="card">
            <div class="card-title">选择平台</div>
            <div class="platform-tabs">
                <div class="platform-tab active" data-platform="fengniao" onclick="selectPlatform('fengniao')">
                    <span class="emoji">🐦</span>
                    蜂鸟平台
                </div>
                <div class="platform-tab" data-platform="meituan" onclick="selectPlatform('meituan')">
                    <span class="emoji">🍜</span>
                    美团
                </div>
            </div>
            <div id="platformTip" class="tip-box">
                ⚠️ 保存到手机相册上传，请勿截图上传会被以非原件驳回
            </div>
        </div>

        <!-- GitHub 配置 -->
        <div class="card">
            <div class="card-title">🔑 GitHub 配置</div>
            <div class="form-group">
                <label>仓库</label>
                <input type="text" id="repoOwner" value="k183f" placeholder="Owner" style="width:40%;display:inline-block;" />
                <span style="padding:0 4px;font-size:18px;">/</span>
                <input type="text" id="repoName" value="ko660" placeholder="Repo" style="width:50%;display:inline-block;" />
            </div>
            <div class="form-group">
                <label>Personal Access Token</label>
                <div class="token-row">
                    <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />
                    <button class="btn-save" onclick="saveToken()">保存</button>
                </div>
                <div class="token-status" id="tokenStatus"></div>
            </div>
        </div>

        <!-- 填写信息 -->
        <div class="card">
            <div class="card-title">📋 填写信息</div>
            <div class="form-group">
                <label>📍 城市</label>
                <input type="text" id="city" value="合肥" placeholder="输入城市" />
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>📝 编号</label>
                    <input type="text" id="idNumber" placeholder="按图片实际填写" />
                </div>
                <div class="form-group">
                    <label>📅 有效期</label>
                    <input type="text" id="validity" placeholder="按图片实际填写" />
                </div>
            </div>
        </div>

        <!-- 选择图片 -->
        <div class="card">
            <div class="card-title">🖼️ 选择图片</div>
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                <div class="icon">📷</div>
                <div class="text">点击选择图片</div>
                <div class="hint">支持 JPG / PNG 格式</div>
                <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(this.files)" />
            </div>
            <div class="preview-list" id="previewList"></div>
        </div>

        <!-- 进度条 -->
        <div class="progress-bar" id="progressBar">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">准备上传...</div>
        </div>

        <!-- 提交 -->
        <button class="btn-submit" id="submitBtn" onclick="startUpload()">
            🚀 提交并上传到仓库
        </button>

        <!-- 结果弹窗 -->
        <div class="modal-overlay" id="resultModal">
            <div class="modal">
                <div class="big-icon" id="resultIcon">📤</div>
                <h3 id="resultTitle">上传结果</h3>
                <div class="summary" id="resultSummary"></div>
                <p style="font-size:13px;color:#888;margin-bottom:16px;" id="resultFooter">
                    图片已上传到仓库，可在页面中查看
                </p>
                <button class="btn-close" onclick="closeModal()">知道了</button>
            </div>
        </div>

        <div class="footer">
            选择图片 → 自动提交到 GitHub 仓库
        </div>

    </div>

    <script>
        const GITHUB_API = 'https://api.github.com';
        let selectedPlatform = 'fengniao';
        let files = [];

        // ---------- 页面加载时读取已保存的 Token ----------
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('github_token');
            if (saved) {
                document.getElementById('githubToken').value = saved;
                document.getElementById('tokenStatus').innerHTML = '✅ Token 已保存';
                document.getElementById('tokenStatus').className = 'token-status ok';
            }
        });

        // ---------- Token 保存 ----------
        function saveToken() {
            const token = document.getElementById('githubToken').value.trim();
            if (!token) {
                document.getElementById('tokenStatus').innerHTML = '⚠️ 请输入 Token';
                document.getElementById('tokenStatus').className = 'token-status err';
                return;
            }
            localStorage.setItem('github_token', token);
            document.getElementById('tokenStatus').innerHTML = '✅ Token 已保存到本地';
            document.getElementById('tokenStatus').className = 'token-status ok';
        }

        // ---------- 平台切换 ----------
        function selectPlatform(platform) {
            selectedPlatform = platform;
            document.querySelectorAll('.platform-tab').forEach(el => {
                el.classList.toggle('active', el.dataset.platform === platform);
            });
            const tip = document.getElementById('platformTip');
            const stepList = document.getElementById('stepList');
            if (platform === 'fengniao') {
                tip.className = 'tip-box';
                tip.innerHTML = '⚠️ 保存到手机相册上传，请勿截图上传会被以非原件驳回';
                stepList.innerHTML = `
                    <li><span class="num">1</span>保存图片到手机相册</li>
                    <li><span class="num">2</span>打开蜂鸟平台上传承诺书</li>
                    <li><span class="num">3</span>上传城市选择 <b>合肥</b></li>
                    <li><span class="num">4</span>编号、有效期与证件一致才能审核通过</li>
                `;
            } else {
                tip.className = 'tip-box success';
                tip.innerHTML = '✅ 美团上传：选择电子版，保存到相册后上传';
                stepList.innerHTML = `
                    <li><span class="num green">1</span>选择电子版</li>
                    <li><span class="num green">2</span>保存到本地相册然后上传</li>
                    <li><span class="num green">3</span>选择类型：电子</li>
                    <li><span class="num green">4</span>填写正确有效期上传即可</li>
                `;
            }
        }

        // ---------- 文件处理 ----------
        function handleFiles(newFiles) {
            for (let i = 0; i < newFiles.length; i++) {
                files.push(newFiles[i]);
            }
            renderPreviews();
            updateUploadArea();
        }

        function renderPreviews() {
            const container = document.getElementById('previewList');
            container.innerHTML = '';
            files.forEach((file, index) => {
                const reader = new FileReader();
                const item = document.createElement('div');
                item.className = 'preview-item';
                item.innerHTML = `<button class="remove" onclick="removeFile(${index})">×</button>`;
                const img = document.createElement('img');
                reader.onload = e => { img.src = e.target.result; };
                reader.readAsDataURL(file);
                item.appendChild(img);
                container.appendChild(item);
            });
        }

        function removeFile(index) {
            files.splice(index, 1);
            renderPreviews();
            updateUploadArea();
        }

        function updateUploadArea() {
            const area = document.getElementById('uploadArea');
            const icon = area.querySelector('.icon');
            const text = area.querySelector('.text');
            const hint = area.querySelector('.hint');
            if (files.length > 0) {
                area.classList.add('has-image');
                icon.textContent = '✅';
                text.textContent = `已选择 ${files.length} 张图片`;
                hint.textContent = '点击继续添加';
            } else {
                area.classList.remove('has-image');
                icon.textContent = '📷';
                text.textContent = '点击选择图片';
                hint.textContent = '支持 JPG / PNG 格式';
            }
        }

        // ---------- GitHub API ----------
        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function commitFileToRepo(token, owner, repo, path, content, message) {
            const url = `${GITHUB_API}/repos/${owner}/${repo}/contents/${path}`;

            // 先尝试获取已有文件（获取 sha）
            let sha = null;
            try {
                const getRes = await fetch(url, {
                    headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
                });
                if (getRes.ok) {
                    const data = await getRes.json();
                    sha = data.sha;
                }
            } catch (e) { /* 文件不存在，忽略 */ }

            const body = { message, content, branch: 'master' };
            if (sha) body.sha = sha;

            const res = await fetch(url, {
                method: 'PUT',
                headers: {
                    Authorization: `token ${token}`,
                    Accept: 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.message || `HTTP ${res.status}`);
            }
            return res.json();
        }

        // ---------- 主上传流程 ----------
        function setProgress(pct, text, cls) {
            document.getElementById('progressBar').classList.add('show');
            document.getElementById('progressFill').style.width = pct + '%';
            const el = document.getElementById('progressText');
            el.textContent = text;
            el.className = 'progress-text' + (cls ? ' ' + cls : '');
        }

        async function startUpload() {
            const token = document.getElementById('githubToken').value.trim();
            const owner = document.getElementById('repoOwner').value.trim() || 'k183f';
            const repo = document.getElementById('repoName').value.trim() || 'ko660';

            // 校验 Token
            if (!token) {
                document.getElementById('tokenStatus').innerHTML = '⚠️ 请先输入并保存 GitHub Token';
                document.getElementById('tokenStatus').className = 'token-status err';
                return;
            }

            // 校验图片
            if (files.length === 0) {
                setProgress(0, '⚠️ 请至少选择一张图片', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 上传中...';

            const city = document.getElementById('city').value || '合肥';
            const idNum = document.getElementById('idNumber').value || '(未填写)';
            const validity = document.getElementById('validity').value || '(未填写)';

            // 生成时间戳目录名
            const now = new Date();
            const ts = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`;
            const folder = `uploads/${ts}`;

            let uploadedUrls = [];
            let successCount = 0;

            try {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const ext = file.name.split('.').pop() || 'jpg';
                    const fileName = `图片${i + 1}.${ext}`;
                    const path = `${folder}/${fileName}`;

                    setProgress(
                        Math.round((i / files.length) * 90),
                        `正在上传 (${i + 1}/${files.length}): ${fileName}`
                    );

                    const base64 = await readFileAsBase64(file);
                    const msg = `Upload ${fileName} - 城市:${city} 编号:${idNum} 有效期:${validity}`;
                    await commitFileToRepo(token, owner, repo, path, base64, msg);

                    const url = `https://${owner}.github.io/${repo}/${path}`;
                    uploadedUrls.push({ name: fileName, url });
                    successCount++;
                }

                setProgress(100, `✅ 上传完成！共 ${successCount} 张图片`, 'success');

                // 展示结果
                showResult(true, uploadedUrls, city, idNum, validity);

            } catch (err) {
                setProgress(0, `❌ 上传失败: ${err.message}`, 'error');
                showResult(false, uploadedUrls, city, idNum, validity, err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '🚀 提交并上传到仓库';
            }
        }

        // ---------- 结果展示 ----------
        function showResult(success, uploadedUrls, city, idNum, validity, errorMsg) {
            const platformName = selectedPlatform === 'fengniao' ? '🐦 蜂鸟平台' : '🍜 美团';

            const icon = document.getElementById('resultIcon');
            const title = document.getElementById('resultTitle');
            const footer = document.getElementById('resultFooter');
            const summary = document.getElementById('resultSummary');

            if (success) {
                icon.textContent = '✅';
                title.textContent = '上传成功！';
                footer.textContent = '图片已提交到仓库，可在以下链接查看';
            } else {
                icon.textContent = '❌';
                title.textContent = '上传失败';
                footer.textContent = errorMsg || '请检查 Token 和网络后重试';
            }

            let html = `
                <div class="row"><span class="lbl">平台</span><span class="val">${platformName}</span></div>
                <div class="row"><span class="lbl">📍 城市</span><span class="val">${city}</span></div>
                <div class="row"><span class="lbl">📝 编号</span><span class="val">${idNum}</span></div>
                <div class="row"><span class="lbl">📅 有效期</span><span class="val">${validity}</span></div>
                <div class="row"><span class="lbl">🖼️ 上传</span><span class="val">${uploadedUrls.length} 张</span></div>
            `;

            if (uploadedUrls.length > 0) {
                html += `<div style="margin-top:10px;border-top:1px solid #eee;padding-top:10px;font-size:13px;font-weight:600;color:#333;">图片链接：</div>`;
                uploadedUrls.forEach(item => {
                    html += `<a class="image-url" href="${item.url}" target="_blank">${item.name}</a>`;
                });
            }

            summary.innerHTML = html;
            document.getElementById('resultModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('resultModal').classList.remove('show');
        }

        // 点击遮罩关闭
        document.getElementById('resultModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
